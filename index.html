<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>こえメモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* レイアウト: 左に録音デスク(タイマー・メーター・リアルタイム文字起こし)、右に録音一覧。狭い画面では縦積み */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #17202c;
  --muted: #5a6677;
  --line: #d6dce5;
  --rec: #d3342b;
  --rec-soft: #fbe7e5;
  --accent: #2351b8;
  --accent-soft: #e4ebfa;
  --mark: #b7791f;
  --mark-soft: #fbf1dc;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1218;
    --surface: #161c25;
    --ink: #e5e9ef;
    --muted: #8d98a8;
    --line: #2a323e;
    --rec: #ff5d52;
    --rec-soft: #3a1c1b;
    --accent: #7da3ff;
    --accent-soft: #1d2a45;
    --mark: #f0b44c;
    --mark-soft: #3a2e16;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
h2, h3 { font-size: 13px; margin: 0; letter-spacing: .12em; color: var(--muted); font-weight: 500; }
.storage { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.grid { display: grid; gap: 20px; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 16px; min-width: 0; }

/* 録音デスク */
.tally { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .14em; font-family: var(--font-mono); color: var(--muted); }
.tally i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.tally.on { color: var(--rec); }
.tally.on i { background: var(--rec); box-shadow: 0 0 0 4px var(--rec-soft); animation: blink 1.2s steps(2, start) infinite; }
.tally.paused { color: var(--accent); }
.tally.paused i { background: var(--accent); }
@keyframes blink { to { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .tally.on i { animation: none; } }
.timer { font-family: var(--font-mono); font-size: clamp(44px, 9vw, 64px); font-weight: 500; letter-spacing: .02em; line-height: 1; font-variant-numeric: tabular-nums; }
canvas#meter { width: 100%; height: 56px; display: block; border-radius: 6px; background: var(--bg); }
.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; }
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, textarea:focus-visible, [contenteditable]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
.btn-rec { background: var(--rec); border-color: var(--rec); color: #fff; font-weight: 700; padding: 12px 22px; font-size: 16px; display: inline-flex; align-items: center; gap: 10px; }
.btn-rec:hover { border-color: var(--rec); filter: brightness(1.06); }
.btn-rec .dot { width: 12px; height: 12px; border-radius: 50%; background: #fff; }
.btn-rec.stop .dot { border-radius: 2px; }
.btn-mark { color: var(--mark); border-color: var(--mark); font-weight: 700; }
.btn-mark:hover { border-color: var(--mark); background: var(--mark-soft); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
.btn-primary:hover { border-color: var(--accent); filter: brightness(1.08); }
.opts { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); align-items: center; }
.opts label { display: inline-flex; gap: 6px; align-items: center; }
select, input[type="search"], input.title, input.mark-label, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.live { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 8px; }
.live-body { max-height: 300px; overflow-y: auto; display: grid; gap: 6px; font-size: 14px; }
.note { font-size: 12.5px; color: var(--muted); }
.note.warn { color: var(--rec); }
.kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.line { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; border-radius: 4px; }
.line.marked { background: var(--mark-soft); box-shadow: -6px 0 0 var(--mark-soft), 6px 0 0 var(--mark-soft); }
.line.mark-row { color: var(--mark); font-weight: 700; font-size: 13px; }
.ts { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
button.ts { border: 0; background: none; padding: 2px 0 0; color: var(--accent); text-align: left; border-radius: 3px; }
.edit { outline: none; border-radius: 3px; overflow-wrap: anywhere; }
.edit:hover { background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.edit:focus { background: var(--surface); box-shadow: 0 0 0 2px var(--accent); }
.interim { color: var(--muted); font-style: italic; }

/* 一覧 */
.list-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.list { display: grid; gap: 10px; }
.empty { color: var(--muted); font-size: 14px; padding: 18px; border: 1px dashed var(--line); border-radius: 8px; }
details.item { border: 1px solid var(--line); border-radius: 8px; }
details.item[open] { border-color: var(--muted); }
details.item summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; gap: 2px; }
details.item summary::-webkit-details-marker { display: none; }
.item-title { font-weight: 700; overflow-wrap: anywhere; }
.item-meta { font-size: 12px; color: var(--muted); font-family: var(--font-mono); display: flex; gap: 8px 12px; flex-wrap: wrap; }
.badge { font-family: var(--font-body); background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 6px; }
.badge.mark { background: var(--mark-soft); color: var(--mark); }
.item-body { padding: 0 14px 14px; display: grid; gap: 16px; }
.sec { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
audio { width: 100%; }
input.title { width: 100%; font-weight: 700; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.actions button, .sec button { font-size: 13px; padding: 6px 12px; }
.actions select { font-size: 13px; }
button.danger { color: var(--rec); }
button.danger.armed { background: var(--rec); color: #fff; border-color: var(--rec); }
.transcript { max-height: 360px; overflow-y: auto; display: grid; gap: 6px; font-size: 14px; background: var(--bg); border-radius: 6px; padding: 10px 12px; }
.marks { display: grid; gap: 6px; }
.mark-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.mark-item .ts { color: var(--mark); font-weight: 700; }
input.mark-label { width: 100%; font-size: 13px; padding: 3px 8px; }
button.icon { border: 0; background: none; color: var(--muted); padding: 2px 8px; font-size: 16px; line-height: 1; }
.progress { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
textarea.minutes { width: 100%; min-height: 260px; resize: vertical; font-size: 14px; line-height: 1.7; }
.links { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
.links a { color: var(--accent); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 5; max-width: calc(100% - 32px); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>こえメモ</h1>
    <span class="storage" id="storage"></span>
  </header>

  <div class="grid">
    <section class="panel" aria-label="録音">
      <span class="tally" id="tally"><i></i><span id="tallyText">STANDBY</span></span>
      <div class="timer" id="timer">00:00:00</div>
      <canvas id="meter" aria-hidden="true"></canvas>
      <div class="controls">
        <button class="btn-rec" id="recBtn"><span class="dot"></span><span id="recLabel">録音開始</span></button>
        <button id="pauseBtn" disabled>一時停止</button>
        <button class="btn-mark" id="markBtn" disabled title="キーボードの M でも付けられます">★ しるし</button>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="srOn" checked> リアルタイム文字起こし</label>
        <label>言語
          <select id="lang">
            <option value="ja-JP">日本語</option>
            <option value="en-US">English</option>
          </select>
        </label>
      </div>
      <div class="live">
        <h2>文字起こし</h2>
        <div class="live-body" id="liveBody"></div>
        <div class="interim" id="interim"></div>
        <div class="note" id="srNote">録音を始めると、話した内容がここに表示されます。</div>
        <div class="note">大事な場面では「★ しるし」を押してください（キーボードの <span class="kbd">M</span> でも可）。</div>
      </div>
    </section>

    <section class="panel" aria-label="録音一覧">
      <div class="list-head">
        <h2>録音一覧</h2>
        <input type="search" id="q" placeholder="タイトル・本文・議事録を検索">
      </div>
      <div class="list" id="list"></div>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const TIMESLICE = 5000;
let db, rec = null, wakeLock = null, recordings = [];

// ---------- IndexedDB ----------
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('koememo', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('recordings', { keyPath: 'id' });
      d.createObjectStore('live', { keyPath: 'sid' });
      d.createObjectStore('chunks', { autoIncrement: true }).createIndex('sid', 'sid');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const req = fn(t.objectStore(store));
    let out;
    if (req) req.onsuccess = () => { out = req.result; };
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
  });
}
const putRec = r => tx('recordings', 'readwrite', s => s.put(r));
function chunksFor(sid) {
  return tx('chunks', 'readonly', s => s.index('sid').getAll(sid));
}
function clearSession(sid) {
  return Promise.all([
    new Promise((res, rej) => {
      const t = db.transaction('chunks', 'readwrite');
      const cur = t.objectStore('chunks').index('sid').openCursor(sid);
      cur.onsuccess = () => { const c = cur.result; if (c) { c.delete(); c.continue(); } };
      t.oncomplete = res; t.onerror = () => rej(t.error);
    }),
    tx('live', 'readwrite', s => s.delete(sid)),
  ]);
}

// ---------- 表示ヘルパー ----------
const pad = n => String(n).padStart(2, '0');
function fmt(ms, long = true) {
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return long || h ? `${pad(h)}:${pad(m)}:${pad(s % 60)}` : `${pad(m)}:${pad(s % 60)}`;
}
function fmtDate(t) {
  const d = new Date(t);
  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600);
}
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  Object.assign(e, props);
  for (const k of kids) if (k != null) e.append(k);
  return e;
}
function save(blob, filename) {
  const a = el('a', { href: URL.createObjectURL(blob), download: filename });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
async function copy(text, done = 'コピーしました') {
  try { await navigator.clipboard.writeText(text); toast(done); }
  catch { toast('コピーできませんでした'); }
}
function safeName(s) { return s.replace(/[\\/:*?"<>|]/g, '_').slice(0, 80); }
function extFor(mime) { return /mp4|aac/.test(mime) ? 'm4a' : /ogg/.test(mime) ? 'ogg' : 'webm'; }
const marksOf = r => (r.marks || []).slice().sort((a, b) => a.t - b.t);
function transcriptLines(r) {
  return (r.transcript || []).map(l => `[${fmt(l.t, false)}] ${l.text}`).join('\n');
}
function exportText(r) {
  const parts = [`${r.title}\n日時: ${fmtDate(r.createdAt)}\n長さ: ${r.duration ? fmt(r.duration) : '不明'}`];
  if (r.minutes?.text) parts.push(`■ 議事録\n${r.minutes.text}`);
  const ms = marksOf(r);
  if (ms.length) parts.push('■ しるし\n' + ms.map(m => `[${fmt(m.t, false)}] ★ ${m.label || ''}`).join('\n'));
  if (r.transcript?.length) parts.push(`■ 文字起こし\n${transcriptLines(r)}`);
  return parts.join('\n\n');
}
async function updateStorage() {
  try {
    const { usage, quota } = await navigator.storage.estimate();
    $('#storage').textContent = `使用 ${(usage / 1048576).toFixed(1)} MB / 空き ${((quota - usage) / 1073741824).toFixed(1)} GB`;
  } catch { }
}
function prefGet(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }
function prefSet(k, v) { try { localStorage.setItem(k, v); } catch { } }

// ---------- 録音 ----------
function pickMime() {
  for (const m of ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg;codecs=opus', 'audio/webm'])
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
const elapsed = () => !rec ? 0 : rec.before + (rec.paused ? 0 : performance.now() - rec.segStart);

async function start() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    toast('マイクを使えません。ブラウザでマイクの使用を許可してください。');
    return;
  }
  try { await navigator.storage.persist(); } catch { }
  const mime = pickMime();
  const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
  const sid = `r${Date.now()}`;
  rec = { sid, mr, stream, mime: mr.mimeType || mime, chunks: [], transcript: [], marks: [], lang: $('#lang').value,
          startedAt: Date.now(), before: 0, segStart: performance.now(), paused: false, srWanted: false, segT: null };

  mr.ondataavailable = e => {
    if (!e.data.size) return;
    rec.chunks.push(e.data);
    tx('chunks', 'readwrite', s => s.add({ sid, data: e.data })).catch(() => { });
  };
  mr.onstop = finalize;
  mr.start(TIMESLICE);
  saveLive();

  // レベルメーター
  const ctx = new AudioContext();
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 1024;
  ctx.createMediaStreamSource(stream).connect(analyser);
  rec.ctx = ctx; rec.analyser = analyser; rec.levels = [];

  $('#liveBody').replaceChildren(); $('#interim').textContent = '';
  if ($('#srOn').checked) startSR(); else $('#srNote').textContent = '文字起こしはオフです。録音のみ保存します。あとから「高精度で文字起こし」もできます。';
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch { }
  setUI(); loop();
}

function togglePause() {
  if (!rec) return;
  if (!rec.paused) {
    rec.mr.pause(); rec.before = elapsed(); rec.paused = true;
    try { rec.sr?.stop(); } catch { }
  } else {
    rec.mr.resume(); rec.segStart = performance.now(); rec.paused = false;
    if (rec.srWanted) try { rec.sr.start(); } catch { }
  }
  setUI();
}

function addLiveMark() {
  if (!rec) return;
  const m = { t: elapsed(), label: '' };
  rec.marks.push(m);
  $('#liveBody').append(el('div', { className: 'line mark-row' },
    el('span', { className: 'ts', textContent: fmt(m.t, false) }), el('span', { textContent: '★ しるし' })));
  $('#liveBody').scrollTop = $('#liveBody').scrollHeight;
  saveLive();
  toast(`${fmt(m.t, false)} にしるしを付けました`);
}

function stop() {
  if (!rec) return;
  rec.before = elapsed(); rec.paused = true;
  rec.srWanted = false;
  try { rec.sr?.stop(); } catch { }
  rec.mr.stop();
}

async function finalize() {
  const r = rec;
  r.stream.getTracks().forEach(t => t.stop());
  r.ctx.close().catch(() => { });
  try { await wakeLock?.release(); } catch { }
  wakeLock = null;
  const item = {
    id: r.sid, title: `${fmtDate(r.startedAt)} の録音`, createdAt: r.startedAt, lang: r.lang,
    duration: r.before, mime: r.mime, blob: new Blob(r.chunks, { type: r.mime }), transcript: r.transcript, marks: r.marks,
  };
  try {
    await putRec(item);
    await clearSession(r.sid);
    toast('録音を保存しました');
  } catch (e) {
    toast('保存に失敗しました。音声ファイルをダウンロードします。');
    save(item.blob, `${safeName(item.title)}.${extFor(item.mime)}`);
  }
  rec = null;
  setUI(); await loadList(r.sid); updateStorage();
}

function saveLive() {
  if (!rec) return;
  const { sid, startedAt, mime, transcript, marks, lang } = rec;
  tx('live', 'readwrite', s => s.put({ sid, startedAt, mime, transcript, marks, lang, elapsed: elapsed() })).catch(() => { });
}

// ---------- リアルタイム音声認識 ----------
function startSR() {
  if (!SR) {
    $('#srNote').textContent = 'このブラウザはリアルタイム文字起こしに対応していません。Chrome か Edge を使ってください。録音は続けられます。';
    $('#srNote').className = 'note warn';
    return;
  }
  const sr = new SR();
  sr.lang = rec.lang; sr.continuous = true; sr.interimResults = true;
  sr.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) {
        const text = res[0].transcript.trim();
        if (text) {
          const line = { t: rec.segT ?? elapsed(), text };
          rec.transcript.push(line);
          $('#liveBody').append(el('div', { className: 'line' },
            el('span', { className: 'ts', textContent: fmt(line.t, false) }), el('span', { textContent: text })));
          $('#liveBody').scrollTop = $('#liveBody').scrollHeight;
          saveLive();
        }
        rec.segT = null;
      } else {
        if (rec.segT == null) rec.segT = elapsed();
        interim += res[0].transcript;
      }
    }
    $('#interim').textContent = interim;
  };
  sr.onend = () => { if (rec && rec.srWanted && !rec.paused) try { sr.start(); } catch { } };
  sr.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      rec.srWanted = false;
      $('#srNote').textContent = 'リアルタイム文字起こしが許可されませんでした。録音は続いています。終わってから「高精度で文字起こし」を使えます。';
      $('#srNote').className = 'note warn';
    }
  };
  rec.sr = sr; rec.srWanted = true;
  try { sr.start(); } catch { }
  $('#srNote').textContent = '文字起こし中。認識はブラウザの音声認識サービスを使います。';
  $('#srNote').className = 'note';
}

// ---------- 高精度文字起こし(Whisper) ----------
const MODELS = {
  turbo: { id: 'onnx-community/whisper-large-v3-turbo', label: '高精度（初回 約1GB）' },
  small: { id: 'Xenova/whisper-small', label: '軽量（初回 約0.3GB）' },
};
const HALLUCINATION = /^(ご視聴ありがとうございました|ご清聴ありがとうございました|チャンネル登録|字幕|おやすみなさい|Thank you for watching)[。.!！\s]*$/i;
let worker = null, job = null;

async function gpuInfo() {
  try {
    const a = await navigator.gpu?.requestAdapter();
    return a ? { ok: true, f16: a.features.has('shader-f16') } : { ok: false };
  } catch { return { ok: false }; }
}
function getWorker() {
  if (!worker) {
    worker = new Worker('whisper-worker.js', { type: 'module' });
    worker.onmessage = e => job?.onmsg(e.data);
    worker.onerror = () => job?.pending?.rej(new Error('文字起こしエンジンを読み込めませんでした。インターネット接続を確認してください。'));
  }
  return worker;
}
function call(msg, transfer = []) {
  return new Promise((res, rej) => { job.pending = { res, rej }; worker.postMessage(msg, transfer); });
}
function cancelJob() {
  if (!job) return;
  job.cancelled = true;
  worker?.terminate(); worker = null;
  job.pending?.rej(new Error('cancelled'));
}
async function decodePCM(blob) {
  const ctx = new AudioContext({ sampleRate: 16000 });
  try {
    const buf = await ctx.decodeAudioData(await blob.arrayBuffer());
    const a = buf.getChannelData(0);
    if (buf.numberOfChannels < 2) return a;
    const b = buf.getChannelData(1), out = new Float32Array(a.length);
    for (let i = 0; i < a.length; i++) out[i] = (a[i] + b[i]) / 2;
    return out;
  } finally { ctx.close().catch(() => { }); }
}
// 30秒以内の区間に分ける。区切りは20〜30秒のあいだで一番静かな所にして、言葉の途中で切れにくくする
function windows(pcm) {
  const SRATE = 16000, out = [];
  let s = 0;
  while (s < pcm.length) {
    let e = Math.min(pcm.length, s + 30 * SRATE);
    if (e < pcm.length) {
      let best = e, bestE = Infinity;
      for (let p = s + 20 * SRATE; p + 1600 <= e; p += 800) {
        let sum = 0;
        for (let k = p; k < p + 1600; k++) sum += pcm[k] * pcm[k];
        if (sum < bestE) { bestE = sum; best = p + 800; }
      }
      e = best;
    }
    out.push([s, e]); s = e;
  }
  return out;
}
function rms(a) { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * a[i]; return Math.sqrt(s / (a.length || 1)); }

async function whisperTranscribe(r, modelKey, ui) {
  if (job) { toast('ほかの文字起こしが進行中です'); return false; }
  const gpu = await gpuInfo();
  if (modelKey === 'turbo' && !gpu.ok) {
    modelKey = 'small';
    toast('この環境ではGPUが使えないため、軽量モデルで文字起こしします');
  }
  const opts = modelKey === 'turbo'
    ? { model: MODELS.turbo.id, device: 'webgpu', dtype: { encoder_model: gpu.f16 ? 'fp16' : 'fp32', decoder_model_merged: 'q4' } }
    : { model: MODELS.small.id, device: gpu.ok ? 'webgpu' : 'wasm', dtype: gpu.ok ? 'fp32' : 'q8' };
  job = {
    cancelled: false,
    onmsg(d) {
      if (d.type === 'progress') ui(d.loaded / d.total, `モデルを準備中… ${Math.round(d.loaded / 1048576)} / ${Math.round(d.total / 1048576)} MB（初回のみ）`);
      else if (d.type === 'error') job?.pending?.rej(new Error(d.message));
      else job?.pending?.res(d);
    },
  };
  try {
    getWorker();
    ui(0, '音声を読み込み中…');
    const pcm = await decodePCM(r.blob);
    ui(0, 'モデルを準備中…');
    await call({ type: 'load', ...opts });
    const wins = windows(pcm), lines = [];
    const language = (r.lang || 'ja-JP').startsWith('en') ? 'english' : 'japanese';
    const t0 = performance.now();
    for (let i = 0; i < wins.length; i++) {
      const [s, e] = wins[i];
      const left = i ? Math.round((performance.now() - t0) / i * (wins.length - i) / 60000) : null;
      ui(i / wins.length, `文字起こし中… ${fmt(s / 16, false)} / ${fmt(pcm.length / 16, false)}` + (left != null ? `（残り約${Math.max(1, left)}分）` : ''));
      const seg = pcm.slice(s, e);
      if (rms(seg) < 0.003) continue;
      const out = await call({ type: 'run', audio: seg, language }, [seg.buffer]);
      const chunks = out.chunks.length ? out.chunks : [{ timestamp: [0], text: out.text }];
      for (const c of chunks) {
        const text = (c.text || '').trim();
        if (!text || HALLUCINATION.test(text)) continue;
        const prev = lines[lines.length - 1];
        if (prev && prev.text === text) continue;
        lines.push({ t: Math.round((s / 16000 + (c.timestamp?.[0] ?? 0)) * 1000), text });
      }
    }
    if (!r.transcriptLive && r.transcript?.length) r.transcriptLive = r.transcript;
    r.transcript = lines;
    r.engine = modelKey;
    await putRec(r);
    ui(1, '');
    toast('高精度の文字起こしが終わりました');
    return true;
  } catch (e) {
    if (e.message === 'cancelled') { ui(0, ''); toast('文字起こしを中止しました'); }
    else ui(0, `うまくいきませんでした：${e.message}`, true);
    return false;
  } finally { job = null; }
}

// ---------- AI議事録(Chrome内蔵AI) ----------
const AI_LANG = { expectedInputs: [{ type: 'text', languages: ['ja'] }], expectedOutputs: [{ type: 'text', languages: ['ja'] }] };
const SUM_OPTS = { type: 'key-points', format: 'markdown', length: 'long', expectedInputLanguages: ['ja', 'en'], outputLanguage: 'ja' };
const MINUTES_FORMAT = `## 概要
（会議の目的と結論を3行以内で）

## 決定事項
-

## ToDo
- 内容／担当／期限（分からなければ「未定」）

## 主な議論
-

## 重要な場面
- [時刻] 内容（★の付いた場面を中心に）`;
const MINUTES_RULES = '文字起こしには聞き間違いが含まれるので、文脈から補って読んでください。話されていないことは書かないでください。★は録音者が付けた重要な場面の印です。';

async function aiEngine() {
  try {
    if ('LanguageModel' in self) {
      const a = await LanguageModel.availability(AI_LANG);
      if (a !== 'unavailable') return { kind: 'lm', state: a };
    }
  } catch { }
  try {
    if ('Summarizer' in self) {
      const a = await Summarizer.availability(SUM_OPTS);
      if (a !== 'unavailable') return { kind: 'sum', state: a };
    }
  } catch { }
  return null;
}
function aiSource(r) {
  const rows = (r.transcript || []).map(l => ({ t: l.t, s: `[${fmt(l.t, false)}] ${l.text}` }));
  for (const m of r.marks || []) rows.push({ t: m.t, s: `[${fmt(m.t, false)}] ★重要${m.label ? '：' + m.label : ''}` });
  return rows.sort((a, b) => a.t - b.t).map(x => x.s);
}
function splitLines(lines, maxChars) {
  const parts = []; let cur = '';
  for (const l of lines) {
    if (cur && cur.length + l.length + 1 > maxChars) { parts.push(cur); cur = ''; }
    cur += (cur ? '\n' : '') + l;
  }
  if (cur) parts.push(cur);
  return parts;
}
function minutesPrompt(body, isNotes) {
  return `${isNotes ? '次の会議メモ（長い文字起こしを分割して要点をまとめたもの）' : '次の会議の文字起こし'}から、下の形式で日本語の議事録を作ってください。${MINUTES_RULES}\n\n形式:\n${MINUTES_FORMAT}\n\n---\n${body}`;
}

async function makeMinutes(r, eng, ui, onText) {
  const lines = aiSource(r);
  const monitor = m => m.addEventListener('downloadprogress', e => ui(`AIモデルをダウンロード中… ${Math.round(e.loaded * 100)}%（初回のみ）`));
  if (eng.kind === 'lm') {
    ui('AIを準備中…');
    const base = await LanguageModel.create({ ...AI_LANG, monitor,
      initialPrompts: [{ role: 'system', content: 'あなたは会議の議事録を作る日本語のアシスタントです。簡潔で正確に書きます。' }] });
    try {
      const maxChars = Math.max(1500, Math.floor((base.inputQuota || 6000) * 0.45));
      const parts = splitLines(lines, maxChars);
      let body = parts[0] || '', isNotes = false;
      if (parts.length > 1) {
        const notes = [];
        for (let i = 0; i < parts.length; i++) {
          ui(`長い会議なので分けて読んでいます… ${i + 1} / ${parts.length}`);
          const s = await base.clone();
          notes.push(await s.prompt(`次は会議の文字起こしの一部（${i + 1}/${parts.length}）です。${MINUTES_RULES}決定事項・ToDo・主な論点・数字・固有名詞・★の場面を漏らさず、時刻つきの箇条書きでメモしてください。\n\n${parts[i]}`));
          s.destroy();
        }
        body = notes.join('\n\n'); isNotes = true;
      }
      ui('議事録を書いています…');
      const s = await base.clone();
      let out = '';
      for await (const c of s.promptStreaming(minutesPrompt(body, isNotes))) {
        out = out && c.startsWith(out) ? c : out + c;
        onText(out);
      }
      s.destroy();
      return { text: out.trim(), engine: 'Chrome内蔵AI（Gemini Nano）' };
    } finally { base.destroy(); }
  }
  ui('AIを準備中…');
  const sm = await Summarizer.create({ ...SUM_OPTS, monitor, sharedContext: `会議の文字起こしです。${MINUTES_RULES}` });
  try {
    const parts = splitLines(lines, Math.max(1500, Math.floor((sm.inputQuota || 4000) * 0.45)));
    const sums = [];
    for (let i = 0; i < parts.length; i++) {
      ui(`要点をまとめています… ${i + 1} / ${parts.length}`);
      sums.push(await sm.summarize(parts[i]));
      onText('## 要点\n\n' + sums.join('\n'));
    }
    return { text: ('## 要点\n\n' + sums.join('\n')).trim(), engine: 'Chrome内蔵AI（要約）' };
  } finally { sm.destroy(); }
}

// ---------- UI ----------
function setUI() {
  const on = !!rec;
  $('#recBtn').classList.toggle('stop', on);
  $('#recLabel').textContent = on ? '停止して保存' : '録音開始';
  $('#pauseBtn').disabled = !on;
  $('#markBtn').disabled = !on;
  $('#pauseBtn').textContent = rec?.paused ? '再開' : '一時停止';
  $('#srOn').disabled = $('#lang').disabled = on;
  const t = $('#tally');
  t.className = 'tally' + (on ? (rec.paused ? ' paused' : ' on') : '');
  $('#tallyText').textContent = on ? (rec.paused ? 'PAUSED' : 'REC') : 'STANDBY';
  if (!on) {
    $('#timer').textContent = '00:00:00'; drawMeter([]); $('#interim').textContent = '';
    if ($('#srNote').className === 'note') $('#srNote').textContent = '録音を始めると、話した内容がここに表示されます。';
  }
}

function loop() {
  if (!rec) return;
  $('#timer').textContent = fmt(elapsed());
  const buf = new Float32Array(rec.analyser.fftSize);
  rec.analyser.getFloatTimeDomainData(buf);
  const level = rec.paused ? 0 : Math.min(1, rms(buf) * 4);
  rec.levels.push(level);
  if (rec.levels.length > 240) rec.levels.shift();
  drawMeter(rec.levels);
  if (!rec.paused && Date.now() - (rec.lastLive || 0) > 10000) { rec.lastLive = Date.now(); saveLive(); }
  requestAnimationFrame(loop);
}

function drawMeter(levels) {
  const c = $('#meter'), dpr = devicePixelRatio || 1;
  const w = c.clientWidth * dpr, h = c.clientHeight * dpr;
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  const g = c.getContext('2d'), cs = getComputedStyle(document.documentElement);
  g.clearRect(0, 0, w, h);
  g.fillStyle = cs.getPropertyValue('--line');
  g.fillRect(0, h / 2 - dpr / 2, w, dpr);
  const bw = w / 240;
  g.fillStyle = cs.getPropertyValue(rec?.paused ? '--accent' : '--rec');
  levels.forEach((v, i) => {
    const bh = Math.max(dpr, v * h * 0.9);
    g.fillRect(w - (levels.length - i) * bw, (h - bh) / 2, Math.max(1, bw - dpr), bh);
  });
}

async function loadList(openId) {
  recordings = (await tx('recordings', 'readonly', s => s.getAll())) || [];

}

function renderList(openId) {
  const q = $('#q').value.trim().toLowerCase();
  const items = recordings.filter(r => !q || r.title.toLowerCase().includes(q) ||
    (r.minutes?.text || '').toLowerCase().includes(q) ||

function metaEl(r) {

      aiNote.textContent = `議事録を作れませんでした（${e.message}）。「Claude・Gemini用にコピー」を試してください。`;
      aiNote.className = 'note warn';
      minutes.value = r.minutes?.text || ''; minutes.hidden = !r.minutes?.text;
    }
    aiBtn.disabled = false;
  };

  // --- 書き出し・削除 ---
  const del = el('button', { className: 'danger', textContent: '削除' });
  del.onclick = async () => {
    if (!del.classList.contains('armed')) {
      del.classList.add('armed'); del.textContent = 'もう一度押すと削除';
      setTimeout(() => { del.classList.remove('armed'); del.textContent = '削除'; }, 3000);
      return;
    }
    await tx('recordings', 'readwrite', s => s.delete(r.id));
    URL.revokeObjectURL(audio.src); toast('削除しました'); loadList(); updateStorage();
  };
  const actions = el('div', { className: 'actions' },
    el('button', { textContent: '音声を保存', onclick: () => save(r.blob, `${safeName(r.title)}.${extFor(r.mime)}`) }),
    el('button', { textContent: 'テキストを保存', onclick: () => save(new Blob([exportText(r)], { type: 'text/plain' }), `${safeName(r.title)}.txt`) }),
    el('button', { textContent: 'すべてコピー', onclick: () => copy(exportText(r)) }),
    del);

  renderMarks(); renderTranscript();
  d.append(el('div', { className: 'item-body' },
    title, audio,
    el('div', { className: 'sec' },
      el('div', { className: 'sec-head' }, el('h3', { textContent: 'しるし' }), addMarkBtn), marksBox),
    el('div', { className: 'sec' },
      el('div', { className: 'sec-head' }, el('h3', { textContent: '文字起こし' })),
      el('div', { className: 'actions' }, wBtn, modelSel, wCancel, restore), wBar, wNote, tr),
    el('div', { className: 'sec' },
      el('div', { className: 'sec-head' }, el('h3', { textContent: 'AI議事録' })),
      el('div', { className: 'actions' }, aiBtn, extBtn), links, aiNote, minutes, minutesActions),
    el('div', { className: 'sec' }, actions)));
}

// ---------- 途中で閉じた録音の復元 ----------
async function recover() {
  const lives = (await tx('live', 'readonly', s => s.getAll())) || [];
  let n = 0;
  for (const l of lives) {
    const chunks = await chunksFor(l.sid);
    if (chunks.length) {
      await putRec({
        id: l.sid, title: `${fmtDate(l.startedAt)} の録音（復元）`, createdAt: l.startedAt, lang: l.lang,
        duration: Math.max(l.elapsed || 0, chunks.length * TIMESLICE - TIMESLICE), mime: l.mime,
        blob: new Blob(chunks.map(c => c.data), { type: l.mime }), transcript: l.transcript || [], marks: l.marks || [], recovered: true,
      });
      n++;
    }
    await clearSession(l.sid);
  }
  if (n) toast(`途中で終了した録音を ${n} 件復元しました`);
}

// ---------- 起動 ----------
$('#recBtn').onclick = () => rec ? stop() : start();
$('#pauseBtn').onclick = togglePause;
$('#markBtn').onclick = addLiveMark;
$('#q').oninput = () => renderList();
document.addEventListener('keydown', e => {
  if (!rec || e.repeat || e.metaKey || e.ctrlKey || e.altKey || e.key.toLowerCase() !== 'm') return;
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  addLiveMark();
});
window.addEventListener('beforeunload', e => { if (rec || job) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', async () => {
  if (rec && document.visibilityState === 'visible' && (!wakeLock || wakeLock.released)) {
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch { }
  }
});
if (!window.MediaRecorder) { $('#recBtn').disabled = true; toast('このブラウザは録音に対応していません'); }
(async () => {
  try { db = await openDB(); await recover(); await loadList(); }
  catch { toast('保存領域を開けません。プライベートウィンドウでは使えません。'); }
  setUI(); updateStorage();
})();
</script>
</body>
</html>
